<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  
  <h1>Job Application Form</h1>
  
  <form action="submAit.html" method="post">
    <fieldset class="card">
    <legend>Personal Information</legend>
    <!-- Text input -->
    <label for="name">First Name:</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="lname">Last Name:</label><br>
    <input type="text" id="lname" name="lname" required><br><br>
    <!-- email -->
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required><br><br>
    
    
    <!-- Phone No. -->
     <label for ="Phone">Phone:</label><br>
     <input type="number" id="Phone" name="Phone" required><br><br>

     </fieldset><br><br>

    <fieldset class="card">
    <legend>Job Details</legend>
    
    <!-- position applied for -->
     <label for ="position">Positon Applied For:</label><br>
     
    <select id="country-select" name="country">
      <option value="">--Select Position-- </option>
      <option value="US">United States</option>
      <option value="CA">Canada</option>
      </select><br><br>

      <!-- Experience -->
    <label for="Experience">Years of Experience</label><br>
    <input type="text" id="Experience" name="Experience" required><br><br>   
    <!-- cover letter -->
      <label for="letter">Cover Letter</label><br>
    <input type="text" id="letter" name="letter" required><br><br> 
    </fieldset>
    <br>

    <fieldset class="card">
        <legend>Availability</legend>

    <!-- DOB -->
    <label for="date">Available Start date:</label><br>
    <input type="date" id="date" name="date" required><br><br>

    <!-- Willing to Relocate -->
    <label for="gender">Willing to Relocate</label><br>
    <input type="radio" id="yes" name="yes" value="yes">
    <label for="male">yes</label>

    <input type="radio" id="no" name="no" value="no">
    <label for="no">no</label><br><br>

    </fieldset>
    


    <input type="submit" value="Submit">
    
  </form>
</body>
</html>
